<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FitAcademie Squash</title>
<style>
/* ── Reset ● Mobile-first ──────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg: #0f1923;
  --surface: #1a2a38;
  --surface2: #243545;
  --border: #2c4050;
  --text: #e0e0e0;
  --text-dim: #8a9ba8;
  --accent: #4fc3f7;
  --green: #2ecc71;
  --yellow: #f1c40f;
  --red: #e74c3c;
  --gray: #546e7a;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--bg); color: var(--text);
  font-size: 16px; height: 100%; overflow: hidden;
}
body { display: flex; flex-direction: column; }
input, select, button, textarea { font-size: 16px; } /* no iOS zoom */

/* ── Login ─────────────────────────────────────────────────────── */
#login-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; min-height: 100dvh;
  background: var(--bg); padding: 20px;
}
.login-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 32px 24px;
  width: 100%; max-width: 400px;
}
.login-card h1 {
  margin: 0 0 4px; font-size: 22px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.login-card .sub { color: var(--text-dim); margin-bottom: 24px; font-size: 14px; }
.login-card label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 13px; color: var(--text-dim); }
.login-card input {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-size: 16px; outline: none; transition: 0.2s;
  -webkit-appearance: none;
}
.login-card input:focus { border-color: var(--accent); }
.login-card .btn {
  -webkit-appearance: none;
  width: 100%; margin-top: 20px; padding: 14px; border: none;
  border-radius: 10px; background: var(--accent); color: #000;
  font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s;
}
.login-card .btn:active { transform: scale(0.98); }
.login-card .btn:disabled { opacity: 0.5; }
.login-card .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.login-card .checkbox-row input { width: auto; }
.login-card .error { color: var(--red); margin-top: 12px; font-size: 13px; }
.login-card .fitacademie-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
.login-card .fitacademie-section h3 { margin: 0 0 4px; font-size: 14px; }
.login-card .fitacademie-section .subhint { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }

/* ── Header ────────────────────────────────────────────────────── */
#app-screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
#app-screen.active { display: flex; }

header {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px; padding-bottom: 10px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0; position: relative; z-index: 50;
}
header > h1 {
  margin: 0; font-size: 18px; font-weight: 700; flex-shrink: 0;
}
header .header-right {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
}
header .header-right button {
  background: none; border: none; color: var(--text-dim); padding: 8px;
  border-radius: 8px; cursor: pointer; font-size: 18px; line-height: 1;
}
header .header-right button:active { background: var(--surface2); }
.logout-btn { color: var(--red) !important; }

/* ── Nav / Day selector ────────────────────────────────────────── */
.day-nav {
  display: flex; align-items: center; gap: 4px;
  padding: 8px 12px; background: var(--surface);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.day-nav::-webkit-scrollbar { display: none; }
.day-nav button {
  flex-shrink: 0; background: none; border: 1px solid transparent;
  padding: 6px 12px; border-radius: 20px; color: var(--text-dim);
  font-size: 13px; font-weight: 500; cursor: pointer;
  white-space: nowrap; transition: 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.day-nav button.active {
  background: var(--accent); color: #000; font-weight: 700;
  border-color: var(--accent);
}
.day-nav button:active { opacity: 0.7; }
.day-nav .nav-arrow {
  padding: 4px 8px; font-size: 18px; color: var(--text-dim);
  border-radius: 20px; flex-shrink: 0;
}

/* ── Grid (single-day on mobile) ───────────────────────────────── */
.grid-wrap {
  flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px;
  -webkit-overflow-scrolling: touch;
}
.grid-day-table {
  width: 100%; border-collapse: collapse; font-size: 14px;
}
.grid-day-table th {
  padding: 8px 6px; text-align: center;
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  color: var(--text-dim); letter-spacing: 0.3px;
  border-bottom: 1px solid var(--border);
}
.grid-day-table td {
  padding: 0; border: none;
}
.grid-day-table td.time-col {
  text-align: right; padding-right: 10px;
  font-size: 12px; color: var(--text-dim);
  width: 48px; white-space: nowrap; vertical-align: middle;
}
.grid-day-table td.court-col {
  padding: 2px;
}
.court-cell {
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  border-radius: 8px; padding: 10px 4px; cursor: pointer;
  font-size: 13px; font-weight: 600; min-height: 44px;
  transition: 0.15s; position: relative;
  -webkit-tap-highlight-color: transparent;
}
.court-cell:active { transform: scale(0.96); }
.court-cell.free { background: var(--green); color: #000; }
.court-cell.one { background: var(--yellow); color: #000; }
.court-cell.full { background: var(--gray); opacity: 0.5; cursor: default; }
.court-cell.closed { background: transparent; cursor: default; color: var(--text-dim); opacity: 0.3; }
.court-cell .sub { font-size: 10px; font-weight: 400; opacity: 0.8; }
.court-cell.own { outline: 2px solid var(--accent); outline-offset: -2px; }

/* ── Legend strip ──────────────────────────────────────────────── */
.legend {
  display: flex; gap: 14px; justify-content: center; padding: 6px 0;
  font-size: 11px; color: var(--text-dim); background: var(--surface);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.legend span { display: flex; align-items: center; gap: 4px; }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }

/* ── Side menu (drawer) ────────────────────────────────────────── */
.drawer-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 100;
}
.drawer-overlay.active { display: block; }
.drawer {
  position: fixed; top: 0; right: -300px; width: 280px;
  height: 100%; height: 100dvh; background: var(--surface);
  border-left: 1px solid var(--border); z-index: 101;
  transition: right 0.25s ease; padding: 24px 20px;
  display: flex; flex-direction: column; overflow-y: auto;
}
.drawer.open { right: 0; }
.drawer h2 { margin: 0 0 16px; font-size: 18px; }
.drawer .close-btn {
  position: absolute; top: 12px; right: 12px;
  background: none; border: none; color: var(--text-dim);
  font-size: 22px; cursor: pointer; padding: 8px;
}
.drawer-section { margin-bottom: 20px; }
.drawer-section h3 { font-size: 13px; color: var(--text-dim); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.drawer .drawer-btn {
  display: block; width: 100%; text-align: left;
  padding: 12px 14px; margin: 4px 0; border-radius: 10px;
  background: var(--bg); border: none; color: var(--text);
  font-size: 15px; font-weight: 500; cursor: pointer;
}
.drawer .drawer-btn:active { background: var(--surface2); }
.drawer .user-email {
  font-size: 13px; color: var(--text-dim); margin-bottom: 16px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}

/* ── Modals (bottom sheet on mobile) ───────────────────────────── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.active { display: flex; }
@media (min-width: 700px) {
  .modal-overlay { align-items: center; }
}
.modal {
  background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 24px 20px; width: 100%; max-width: 500px;
  max-height: 85vh; max-height: 85dvh; overflow-y: auto;
  border: none; animation: slideUp 0.25s ease;
  padding-bottom: calc(24px + var(--safe-bottom));
}
@media (min-width: 700px) {
  .modal {
    border-radius: 20px; width: 480px; animation: fadeIn 0.2s ease;
  }
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
.modal .handle {
  width: 40px; height: 4px; background: var(--border); border-radius: 2px;
  margin: 0 auto 16px;
}
@media (min-width: 700px) { .modal .handle { display: none; } }
.modal h2 { margin: 0 0 12px; font-size: 18px; }
.modal h3 { margin: 16px 0 6px; font-size: 14px; color: var(--text-dim); }
.modal p { margin: 4px 0 14px; color: var(--text-dim); font-size: 14px; }
.modal label { display: block; margin: 12px 0 4px; font-size: 13px; font-weight: 600; color: var(--text-dim); }
.modal input, .modal select {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-size: 16px; -webkit-appearance: none;
}
.modal .btn-row { display: flex; gap: 10px; margin-top: 18px; }
.modal .btn {
  flex: 1; padding: 14px; border: none; border-radius: 10px;
  font-weight: 600; font-size: 15px; cursor: pointer;
}
.modal .btn:active { opacity: 0.8; }
.modal .btn-primary { background: var(--accent); color: #000; }
.modal .btn-secondary { background: var(--border); color: var(--text); }
.modal .btn-danger { background: var(--red); color: #fff; }

/* ── UI Components ─────────────────────────────────────────────── */
.tag {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 600;
}
.tag.bepalend { background: #2ecc7140; color: var(--green); border: 1px solid var(--green); }
.tag.gast { background: #f39c1240; color: var(--yellow); border: 1px solid var(--yellow); }

.partner-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; margin: 4px 0; border-radius: 10px;
  background: var(--bg);
}
.partner-item .info { flex: 1; }
.partner-item .info .name { font-weight: 600; }
.partner-item .info .email { font-size: 13px; color: var(--text-dim); }
.partner-item .actions { display: flex; gap: 4px; }
.partner-item .actions button {
  background: none; border: none; color: var(--text-dim);
  padding: 6px 10px; cursor: pointer; border-radius: 6px; font-size: 16px;
}
.partner-item .actions button:active { background: var(--surface2); }

.recurring-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; margin: 4px 0; border-radius: 10px; background: var(--bg);
}
.recurring-item .info { flex: 1; }
.recurring-item .info .main { font-weight: 600; }
.recurring-item .info .sub { font-size: 13px; color: var(--text-dim); }
.toggle {
  width: 44px; height: 24px; border-radius: 12px; border: none;
  cursor: pointer; position: relative; flex-shrink: 0; transition: 0.2s;
}
.toggle.on { background: var(--green); }
.toggle.off { background: var(--gray); }
.toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 20px; height: 20px; border-radius: 50%; background: #fff;
  transition: 0.2s;
}
.toggle.on::after { left: 22px; }

.loading { display: flex; align-items: center; justify-content: center; height: 150px; color: var(--text-dim); }
.spinner { animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

.checkbox-row { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
.checkbox-row input { width: auto; }
.dual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── Desktop overrides ─────────────────────────────────────────── */
@media (min-width: 701px) {
  .day-nav { justify-content: center; }
  .legend { justify-content: center; }
  .grid-day-table th { font-size: 13px; padding: 10px; min-width: 100px; }
  .court-cell { min-height: 36px; padding: 8px; font-size: 12px; }
}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login-screen">
  <div class="login-card">
    <h1>🏸 Squash</h1>
    <div class="sub">FitAcademie Bokkeduinen</div>
    <label>Jouw e-mail</label>
    <input type="email" id="login-email" placeholder="jij@email.nl" autocomplete="email">
    <label>Wachtwoord</label>
    <input type="password" id="login-password" placeholder="wachtwoord" autocomplete="current-password">
    <div class="checkbox-row">
      <input type="checkbox" id="login-remember"><label for="login-remember">Onthoud mij</label>
    </div>
    <button class="btn" id="login-btn" onclick="handleLogin()">Inloggen</button>
    <div class="error" id="login-error"></div>
    <div class="fitacademie-section">
      <h3>🔑 FitAcademie Portal</h3>
      <div class="subhint">Wordt versleuteld opgeslagen</div>
      <label>Portal e-mail</label>
      <input type="email" id="login-fa-email" placeholder="wrvanbeek@gmail.com" autocomplete="off">
      <label>Portal wachtwoord</label>
      <input type="password" id="login-fa-password" placeholder="FitAcademie wachtwoord" autocomplete="off">
    </div>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app-screen">
  <header>
    <h1>🏸 Squash</h1>
    <div class="header-right">
      <button onclick="toggleDrawer()" aria-label="Menu">☰</button>
    </div>
  </header>

  <div class="day-nav" id="day-nav"></div>
  <div class="legend">
    <span><span class="dot" style="background:var(--green)"></span> vrij</span>
    <span><span class="dot" style="background:var(--yellow)"></span> 1/2</span>
    <span><span class="dot" style="background:var(--gray)"></span> vol</span>
  </div>
  <div class="grid-wrap" id="grid-wrap">
    <div class="loading"><span class="spinner">⟳</span> Laden...</div>
  </div>
</div>

<!-- ═══════════ DRAWER ═══════════ -->
<div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <button class="close-btn" onclick="toggleDrawer()">✕</button>
  <div id="drawer-user-email" class="user-email"></div>
  <div class="drawer-section">
    <h3>Menu</h3>
    <button class="drawer-btn" onclick="toggleDrawer();showPartnersModal()">👥 Medespelers</button>
    <button class="drawer-btn" onclick="toggleDrawer();showRecurringModal()">🔄 Terugkerend</button>
    <button class="drawer-btn" onclick="toggleDrawer();showReservationsModal()">📋 Mijn reserveringen</button>
    <button class="drawer-btn" style="color:var(--red)" onclick="toggleDrawer();handleLogout()">← Uitloggen</button>
  </div>
</div>

<!-- ═══════════ RESERVE MODAL ═══════════ -->
<div class="modal-overlay" id="reserve-modal" onclick="if(event.target===this)closeModal('reserve-modal')">
  <div class="modal">
    <div class="handle"></div>
    <h2 id="reserve-title">Reserveer</h2>
    <p id="reserve-details"></p>
    <label>Medespeler</label>
    <select id="reserve-partner"></select>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeModal('reserve-modal')">Annuleren</button>
      <button class="btn btn-primary" id="reserve-confirm-btn" onclick="confirmReservation()">✅ Reserveer</button>
    </div>
    <div id="reserve-result" style="margin-top:12px;font-size:13px"></div>
  </div>
</div>

<!-- ═══════════ PARTNERS MODAL ═══════════ -->
<div class="modal-overlay" id="partners-modal" onclick="if(event.target===this)closeModal('partners-modal')">
  <div class="modal">
    <div class="handle"></div>
    <h2>👥 Medespelers</h2>
    <div id="partners-list"></div>
    <h3>Nieuwe medespeler</h3>
    <label>Naam</label>
    <input type="text" id="partner-name" placeholder="bv. Stijn">
    <label>E-mail</label>
    <input type="email" id="partner-email" placeholder="stijn@voorbeeld.nl">
    <div class="checkbox-row">
      <input type="checkbox" id="partner-bepalend"><label for="partner-bepalend"><b>Bepalend lid</b> — geen extra kosten, direct voltooid</label>
    </div>
    <button class="btn btn-primary" onclick="addPartner()">➕ Toevoegen</button>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn btn-secondary" onclick="closeModal('partners-modal')">Sluiten</button>
    </div>
  </div>
</div>

<!-- ═══════════ RECURRING MODAL ═══════════ -->
<div class="modal-overlay" id="recurring-modal" onclick="if(event.target===this)closeModal('recurring-modal')">
  <div class="modal">
    <div class="handle"></div>
    <h2>🔄 Terugkerend</h2>
    <div id="recurring-list"></div>
    <h3>Nieuwe boeking</h3>
    <label>Medespeler</label>
    <select id="recurring-partner"></select>
    <div class="dual-grid">
      <div><label>Baan</label><select id="recurring-court"><option value="1">Baan 1</option><option value="2">Baan 2</option></select></div>
      <div><label>Dag</label>
        <select id="recurring-weekday">
          <option value="0">Ma</option><option value="1">Di</option><option value="2" selected>Wo</option>
          <option value="3">Do</option><option value="4">Vr</option><option value="5">Za</option><option value="6">Zo</option>
        </select>
      </div>
    </div>
    <div class="dual-grid">
      <div><label>Tijd</label>
        <select id="recurring-time">
          <option value="07:00">07:00</option><option value="08:00">08:00</option><option value="09:00">09:00</option>
          <option value="10:00">10:00</option><option value="11:00">11:00</option><option value="12:00">12:00</option>
          <option value="13:00">13:00</option><option value="14:00">14:00</option><option value="15:00">15:00</option>
          <option value="16:00">16:00</option><option value="17:00">17:00</option><option value="18:00">18:00</option>
          <option value="19:00" selected>19:00</option><option value="20:00">20:00</option><option value="21:00">21:00</option>
          <option value="22:00">22:00</option>
        </select>
      </div>
      <div><label>Frequentie</label>
        <select id="recurring-frequency"><option value="weekly">Wekelijks</option><option value="biweekly">2-wekelijks</option></select>
      </div>
    </div>
    <button class="btn btn-primary" onclick="addRecurring()" style="margin-top:8px">➕ Toevoegen</button>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn btn-secondary" onclick="closeModal('recurring-modal')">Sluiten</button>
    </div>
  </div>
</div>

<!-- ═══════════ RESERVATIONS HISTORY MODAL ═══════════ -->
<div class="modal-overlay" id="reservations-modal" onclick="if(event.target===this)closeModal('reservations-modal')">
  <div class="modal">
    <div class="handle"></div>
    <h2>📋 Mijn reserveringen</h2>
    <div id="reservations-list"><p style="color:var(--text-dim)">Laden...</p></div>
    <div class="btn-row"><button class="btn btn-secondary" onclick="closeModal('reservations-modal')">Sluiten</button></div>
  </div>
</div>

<script>
// ═══════════════ STATE ═══════════════════════════════════════════
const state = {
  user: null, token: null,
  weekOffset: 0, selectedDayIdx: 0, // 0=Monday
  dayDates: [], slots: [], partners: [],
  gridData: {}, selectedCell: null,
};

// ═══════════════ AUTH ════════════════════════════════════════════
async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pwd = document.getElementById('login-password').value;
  const faEmail = document.getElementById('login-fa-email').value.trim();
  const faPwd = document.getElementById('login-fa-password').value;
  const rem = document.getElementById('login-remember').checked;
  const err = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  if (!email || !pwd) { err.textContent = 'Vul e-mail en wachtwoord in'; return; }
  btn.disabled = true; btn.textContent = 'Bezig...';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email,password,fitacademie_email:faEmail,fitacademie_password:faPwd,remember:rem}),
    });
    const d = await r.json();
    if (!d.success) { err.textContent = d.detail || 'Login mislukt'; btn.disabled=false; btn.textContent='Inloggen'; return; }
    state.token = d.token; state.user = d.user;
    showApp();
  } catch(e) { err.textContent = 'Server offline?'; btn.disabled=false; btn.textContent='Inloggen'; }
}

async function checkSession() {
  try {
    const r = await fetch('/api/auth/me');
    if (!r.ok) return false;
    const d = await r.json();
    state.user = {id:d.id,email:d.email};
    state.token = document.cookie.match(/session_token=([^;]+)/)?.[1] || null;
    return true;
  } catch { return false; }
}

async function handleLogout() {
  await fetch('/api/auth/logout', {method:'POST'});
  state.user = null; state.token = null;
  document.getElementById('app-screen').classList.remove('active');
  document.getElementById('login-screen').style.display = 'flex';
}

// ═══════════════ APP ═════════════════════════════════════════════
async function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').classList.add('active');
  document.getElementById('drawer-user-email').textContent = state.user.email;
  await loadGrid(); await loadPartners();
}

function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('drawer-overlay').classList.toggle('active');
}

// ═══════════════ GRID ════════════════════════════════════════════
const DAYS = ['Ma','Di','Wo','Do','Vr','Za','Zo'];
const HOURS = Array.from({length:16}, (_,i)=> String(i+7).padStart(2,'0')+':00');
const COURTS = ['Baan 1','Baan 2'];

function getWeekStart(offset) {
  const now = new Date();
  const day = now.getDay();
  const monOff = day === 0 ? -6 : 1-day;
  const s = new Date(now); s.setDate(now.getDate() + monOff + offset*7);
  return s;
}

function fmtDate(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function id(date,court,time) { return `${date}_B${court}_${time}`; }

function getTodayIdx() {
  const now = new Date(); const d = now.getDay();
  return d === 0 ? 6 : d-1;
}

async function loadGrid() {
  const start = getWeekStart(state.weekOffset);
  state.dayDates = [];
  for (let i=0;i<7;i++) { const d=new Date(start); d.setDate(start.getDate()+i); state.dayDates.push(fmtDate(d)); }

  // Default to today if in range
  const todayIdx = getTodayIdx();
  // If week offset is 0, todayIdx works; otherwise default to day 0
  state.selectedDayIdx = state.weekOffset === 0 ? todayIdx : 0;

  try {
    const res = await fetch('/api/grid?start='+state.dayDates[0]+'&days=7', {
      headers: {'Authorization':'Bearer '+state.token}
    });
    if (res.status === 401) { handleLogout(); return; }
    if (!res.ok) { document.getElementById('grid-wrap').innerHTML='<div class="loading" style="color:var(--red)">Fout bij laden</div>'; return; }
    const data = await res.json();
    state.slots = data.slots || [];
    state.gridData = {};
    for (const s of state.slots) {
      state.gridData[id(s.date,s.court,s.start)] = s;
    }
    renderDayNav();
    renderDay(state.selectedDayIdx);
  } catch(e) {
    document.getElementById('grid-wrap').innerHTML='<div class="loading" style="color:var(--red)">Netwerkfout</div>';
  }
}

function renderDayNav() {
  const nav = document.getElementById('day-nav');
  nav.innerHTML = `<button class="nav-arrow" onclick="navigateWeek(-1)">←</button>`;
  state.dayDates.forEach((d,i) => {
    const dt = new Date(d+'T12:00:00');
    const dayName = DAYS[dt.getDay() === 0 ? 6 : dt.getDay()-1];
    const dateNum = dt.getDate();
    const active = i === state.selectedDayIdx ? 'active' : '';
    nav.innerHTML += `<button class="${active}" onclick="selectDay(${i})">${dayName} ${dateNum}</button>`;
  });
  nav.innerHTML += `<button class="nav-arrow" onclick="navigateWeek(1)">→</button>`;
}

function selectDay(idx) {
  state.selectedDayIdx = idx;
  renderDayNav();
  renderDay(idx);
}

function navigateWeek(dir) {
  state.weekOffset += dir;
  loadGrid();
}

function renderDay(idx) {
  const dateStr = state.dayDates[idx];
  const wrap = document.getElementById('grid-wrap');
  if (!dateStr) { wrap.innerHTML = ''; return; }

  let html = `<table class="grid-day-table"><thead><tr><th></th>`;
  for (let c=0;c<2;c++) html += `<th>${COURTS[c]}</th>`;
  html += `</tr></thead><tbody>`;

  for (const hour of HOURS) {
    html += `<tr><td class="time-col">${hour}</td>`;
    for (let c=0;c<2;c++) {
      const court = c+1;
      const key = id(dateStr, court, hour);
      const slot = state.gridData[key];
      let cls = 'closed', label = '—', sub = '';
      if (slot) {
        if (slot.booked >= slot.capacity) { cls='full'; label='vol'; }
        else if (slot.booked === 0) { cls='free'; label='vrij'; }
        else { cls='one'; label='1/2'; }
        sub = `€${slot.price}`;
      }
      html += `<td class="court-col"><div class="court-cell ${cls}" data-key="${key}" data-date="${dateStr}" data-court="${court}" data-time="${hour}" onclick="cellClick(this)"><span>${label}</span>${sub ? '<span class="sub">'+sub+'</span>' : ''}</div></td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table>`;
  wrap.innerHTML = html;
}

function cellClick(el) {
  if (el.classList.contains('full') || el.classList.contains('closed')) return;
  state.selectedCell = {
    date: el.dataset.date,
    court: parseInt(el.dataset.court),
    time: el.dataset.time,
  };
  const dt = new Date(el.dataset.date+'T12:00:00');
  const dayName = DAYS[dt.getDay() === 0 ? 6 : dt.getDay()-1];
  document.getElementById('reserve-title').textContent = `${COURTS[state.selectedCell.court-1]}`;
  document.getElementById('reserve-details').textContent = `${dayName} ${dt.getDate()} sep · ${state.selectedCell.time}`;
  document.getElementById('reserve-result').textContent = '';
  const sel = document.getElementById('reserve-partner');
  sel.innerHTML = '<option value="">Kies medespeler...</option>';
  state.partners.forEach(p => {
    sel.innerHTML += `<option value="${p.id}">${p.name} (${p.email})${p.is_bepalend_lid?' ⭐':''}</option>`;
  });
  showModal('reserve-modal');
}

async function confirmReservation() {
  const pid = document.getElementById('reserve-partner').value;
  const resEl = document.getElementById('reserve-result');
  if (!pid) { resEl.textContent = '❌ Kies een medespeler'; return; }
  const partner = state.partners.find(p => p.id == pid);
  resEl.innerHTML = '<span class="spinner">⟳</span> Reserveren...';
  document.getElementById('reserve-confirm-btn').disabled = true;

  try {
    const r = await fetch('/api/reserve', {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.token},
      body: JSON.stringify({court:state.selectedCell.court, date:state.selectedCell.date, time:state.selectedCell.time, partner_id:parseInt(pid)}),
    });
    const d = await r.json();
    if (d.success) {
      resEl.innerHTML = `<span style="color:var(--green)">✅ Gereserveerd!</span>`;
      setTimeout(() => closeModal('reserve-modal'), 1500);
      loadGrid();
    } else {
      resEl.innerHTML = `<span style="color:var(--red)">❌ ${d.error||'Mislukt'}</span>`;
      document.getElementById('reserve-confirm-btn').disabled = false;
    }
  } catch(e) {
    resEl.innerHTML = `<span style="color:var(--red)">❌ ${e.message}</span>`;
    document.getElementById('reserve-confirm-btn').disabled = false;
  }
}

// ═══════════════ PARTNERS ════════════════════════════════════════
async function loadPartners() {
  try {
    const r = await fetch('/api/partners', {headers:{'Authorization':'Bearer '+state.token}});
    if (r.ok) state.partners = await r.json();
  } catch {}
}

function renderPartners() {
  const el = document.getElementById('partners-list');
  if (!state.partners.length) { el.innerHTML='<p style="color:var(--text-dim)">Nog geen medespelers</p>'; return; }
  el.innerHTML = state.partners.map(p => `
    <div class="partner-item">
      <div class="info"><div class="name">${p.name}</div><div class="email">${p.email}</div></div>
      <div><span class="tag ${p.is_bepalend_lid?'bepalend':'gast'}">${p.is_bepalend_lid?'⭐ Bepalend':'Gast'}</span>
        <button onclick="deletePartner(${p.id})" style="background:none;border:none;color:var(--red);cursor:pointer;padding:4px 8px">🗑️</button>
      </div>
    </div>`).join('');
}

async function addPartner() {
  const n = document.getElementById('partner-name').value.trim();
  const e = document.getElementById('partner-email').value.trim();
  const b = document.getElementById('partner-bepalend').checked;
  if (!n||!e) return;
  await fetch('/api/partners', {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.token},
    body: JSON.stringify({name:n,email:e,is_bepalend_lid:b,notes:''})});
  document.getElementById('partner-name').value=''; document.getElementById('partner-email').value='';
  document.getElementById('partner-bepalend').checked=false;
  await loadPartners(); renderPartners();
}

async function deletePartner(id) {
  if (!confirm('Verwijderen?')) return;
  await fetch('/api/partners/'+id, {method:'DELETE', headers:{'Authorization':'Bearer '+state.token}});
  await loadPartners(); renderPartners();
}

function showPartnersModal() { renderPartners(); showModal('partners-modal'); }

// ═══════════════ RECURRING ═══════════════════════════════════════
async function loadRecurring() {
  try { const r=await fetch('/api/recurring',{headers:{'Authorization':'Bearer '+state.token}}); if(r.ok)return await r.json(); }catch{}
  return [];
}

function renderRecurring(bookings) {
  const el=document.getElementById('recurring-list');
  const dn=['Ma','Di','Wo','Do','Vr','Za','Zo'];
  if(!bookings.length){el.innerHTML='<p style="color:var(--text-dim)">Geen terugkerende boekingen</p>';return;}
  el.innerHTML=bookings.map(b=>{
    const p=state.partners.find(x=>x.id==b.partner_id);
    return `<div class="recurring-item">
      <div class="info"><div class="main">Baan ${b.court} · ${dn[b.weekday]} ${b.time}</div>
      <div class="sub">${p?p.name:'?'} · ${b.frequency==='weekly'?'Wekelijks':'2-wekelijks'}</div></div>
      <button class="toggle ${b.active?'on':'off'}" onclick="toggleRecur(${b.id},${!b.active})"></button>
      <button onclick="deleteRecur(${b.id})" style="background:none;border:none;color:var(--red);cursor:pointer">🗑️</button>
    </div>`;
  }).join('');
}

async function toggleRecur(id,active) {
  await fetch('/api/recurring/'+id+'?active='+active,{method:'PATCH',headers:{'Authorization':'Bearer '+state.token}});
  renderRecurring(await loadRecurring());
}
async function deleteRecur(id) {
  if(!confirm('Verwijderen?'))return;
  await fetch('/api/recurring/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+state.token}});
  renderRecurring(await loadRecurring());
}

async function showRecurringModal() {
  const sel=document.getElementById('recurring-partner');
  sel.innerHTML='<option value="">Kies...</option>';
  state.partners.forEach(p=>{sel.innerHTML+=`<option value="${p.id}">${p.name} (${p.email})</option>`;});
  renderRecurring(await loadRecurring());
  showModal('recurring-modal');
}

async function addRecurring() {
  const pid=document.getElementById('recurring-partner').value;
  const court=parseInt(document.getElementById('recurring-court').value);
  const wd=parseInt(document.getElementById('recurring-weekday').value);
  const t=document.getElementById('recurring-time').value;
  const f=document.getElementById('recurring-frequency').value;
  if(!pid)return;
  await fetch('/api/recurring',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.token},
    body:JSON.stringify({partner_id:parseInt(pid),court,weekday:wd,time:t,frequency:f})});
  renderRecurring(await loadRecurring());
}

// ═══════════════ RESERVATIONS HISTORY ════════════════════════════
async function showReservationsModal() {
  const el=document.getElementById('reservations-list');
  el.innerHTML='<div class="loading"><span class="spinner">⟳</span> Laden...</div>';
  showModal('reservations-modal');
  try{
    const r=await fetch('/api/grid?start='+state.dayDates[0]+'&days=14',{headers:{'Authorization':'Bearer '+state.token}});
    if(!r.ok)throw Error();
    const d=await r.json();
    const slots=d.slots||[];
    const mine=slots.filter(s=>s.booked>0);
    if(!mine.length){el.innerHTML='<p style="color:var(--text-dim)">Geen reserveringen deze 2 weken</p>';return;}
    el.innerHTML=mine.map(s=>{
      const dt=new Date(s.date+'T12:00:00');
      const dn=DAYS[dt.getDay()===0?6:dt.getDay()-1];
      return `<div class="partner-item"><div class="info"><div class="name">Baan ${s.court} · ${dn} ${dt.getDate()} sep</div><div class="email">${s.start}-${s.end}</div></div><span class="tag ${s.available?'':'bepalend'}">${s.available?'Bezet':'Vol'}</span></div>`;
    }).join('');
  }catch{e.l.innerHTML='<p style="color:var(--red)">Fout bij laden</p>';}
}

// ═══════════════ UI ══════════════════════════════════════════════
function showModal(id){document.getElementById(id).classList.add('active');}
function closeModal(id){document.getElementById(id).classList.remove('active');}

// Init
(async function(){
  if(await checkSession()) showApp();
})();
</script>
